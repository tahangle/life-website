<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="apple-touch-icon.png">
    <title>Food & Groceries</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--text-dark);
        }

        .budget-pill {
            background: linear-gradient(135deg, var(--sage) 0%, #7BA896 100%);
            padding: 10px 18px;
            border-radius: 20px;
            color: white;
            font-size: 0.9rem;
        }

        .budget-pill strong {
            font-weight: 600;
        }

        /* Week Navigation */
        .week-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .week-nav button {
            background: var(--cream);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .week-nav button:hover {
            background: var(--sage);
            color: white;
        }

        .week-label {
            font-weight: 500;
            color: var(--text-dark);
        }

        /* Calendar Grid */
        .week-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }

        @media (max-width: 900px) {
            .week-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 600px) {
            .week-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .day-card {
            background: var(--white);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 2px 8px var(--shadow);
            min-height: 160px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.2s;
        }

        .day-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .day-card.rest-day {
            background: linear-gradient(135deg, #F3E8FF 0%, #FCE7F3 100%);
        }

        .day-card.shopping-day {
            border: 2px solid #0288D1;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .day-info {
            text-align: left;
        }

        .day-name {
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--text-dark);
        }

        .day-date {
            font-size: 1.1rem;
            color: var(--text);
        }

        .day-tags {
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: flex-end;
        }

        .tag {
            font-size: 0.5rem;
            padding: 2px 5px;
            border-radius: 6px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .tag-gym { background: #E8F5E9; color: #2E7D32; }
        .tag-work { background: #E3F2FD; color: #1565C0; }
        .tag-close { background: #FFCCBC; color: #BF360C; }
        .tag-off { background: #FCE4EC; color: #C2185B; }
        .tag-shop { background: #B3E5FC; color: #0277BD; }

        .meal-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .meal-slot {
            background: var(--cream);
            border-radius: 8px;
            padding: 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .meal-slot.leftover {
            background: var(--lavender-soft);
            border: 1px dashed var(--lavender);
        }

        .meal-slot.empty {
            border: 2px dashed var(--blush);
            background: transparent;
            justify-content: center;
            align-items: center;
        }

        .meal-name {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .meal-name .icon {
            margin-right: 4px;
        }

        .meal-ingredients {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            flex: 1;
        }

        .ing-tag {
            font-size: 0.55rem;
            padding: 2px 5px;
            background: var(--white);
            border-radius: 8px;
            color: var(--text);
        }

        .ing-tag.protein {
            background: #FFEBEE;
            color: #C62828;
        }

        .meal-meta {
            font-size: 0.6rem;
            color: var(--text-light);
            margin-top: 6px;
        }

        .empty-text {
            font-size: 0.7rem;
            color: var(--text-light);
            font-style: italic;
        }

        /* Shopping Section */
        .shopping-section {
            background: var(--white);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px var(--shadow);
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 16px;
        }

        .shopping-trips {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .shop-trip {
            border: 2px solid var(--sage);
            border-radius: 12px;
            overflow: hidden;
        }

        .shop-trip-header {
            background: var(--sage);
            color: white;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shop-trip-date {
            font-weight: 600;
        }

        .shop-trip-items {
            padding: 12px;
            max-height: 200px;
            overflow-y: auto;
        }

        .shop-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid var(--soft-pink);
            font-size: 0.85rem;
        }

        .shop-item:last-child {
            border-bottom: none;
        }

        .shop-item-check {
            width: 18px;
            height: 18px;
            border: 2px solid var(--blush);
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
        }

        .shop-item.checked .shop-item-check {
            background: var(--sage);
            border-color: var(--sage);
        }

        .shop-item.checked .shop-item-name {
            text-decoration: line-through;
            color: var(--text-light);
        }

        .shop-item-name {
            flex: 1;
        }

        .shop-item-note {
            font-size: 0.65rem;
            color: var(--sage-dark);
            background: #E8F5E9;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .no-shopping {
            text-align: center;
            padding: 20px;
            color: var(--text-light);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-light);
            cursor: pointer;
        }

        .modal-subtitle {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-bottom: 16px;
        }

        .meal-option {
            padding: 12px;
            background: var(--cream);
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .meal-option:hover {
            background: var(--soft-pink);
        }

        .meal-option.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .meal-option-name {
            font-weight: 500;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }

        .meal-option-ing {
            font-size: 0.7rem;
            color: var(--text);
            margin-bottom: 4px;
        }

        .meal-option-meta {
            font-size: 0.65rem;
            color: var(--text-light);
        }

        .meal-option-warning {
            font-size: 0.65rem;
            color: #C62828;
            margin-top: 4px;
        }

        .clear-btn {
            width: 100%;
            padding: 10px;
            background: var(--cream);
            border: none;
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            margin-top: 8px;
        }

        .clear-btn:hover {
            background: #FFEBEE;
            color: #C62828;
        }

        /* Ticket Resto Status */
        .ticket-status {
            background: var(--white);
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .ticket-today {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ticket-label {
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .ticket-value {
            font-weight: 600;
            color: var(--sage);
        }

        .ticket-value.over {
            color: #C62828;
        }

        .ticket-spent {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        /* Outside Purchases */
        .outside-purchases {
            background: #FFF3E0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .outside-purchases .section-title {
            color: #E65100;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .outside-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: white;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .outside-item-name {
            color: var(--text-dark);
        }

        .outside-item-amount {
            color: #E65100;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <header class="page-header">
            <h1 class="page-title">Food & Groceries</h1>
            <div class="budget-pill">
                <strong id="budgetRemaining">€25</strong> ticket resto today
            </div>
        </header>

        <!-- Today's Ticket Resto Status -->
        <div class="ticket-status" id="ticketStatus">
            <div class="ticket-today">
                <span class="ticket-label">Today's limit:</span>
                <span class="ticket-value" id="ticketTodayLeft">€25.00 left</span>
            </div>
            <div class="ticket-spent" id="ticketTodaySpent"></div>
        </div>

        <!-- Outside Purchases (food bought not on grocery list) -->
        <div class="outside-purchases" id="outsidePurchases" style="display: none;">

        </div>

    <!-- Modal -->
    <div class="modal-overlay" id="mealModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">Pick a meal</span>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-subtitle" id="modalSubtitle"></div>

    <script>
        // Ticket Resto Integration
        function loadTicketRestoData() {
            const saved = localStorage.getItem('ticketRestoData');
            if (saved) {
                return JSON.parse(saved);
            }
            return { expenses: [], total: 0, outsidePurchases: [] };
        }

        function updateTicketRestoDisplay() {
            const data = loadTicketRestoData();
            const today = new Date().toDateString();

            // Calculate today's spending
            const todayExpenses = data.expenses.filter(e =>
                new Date(e.date || e.approvedAt).toDateString() === today
            );
            const todaySpent = todayExpenses.reduce((sum, e) => sum + e.amount, 0);
            const todayLeft = Math.max(0, 25 - todaySpent);

            // Update header pill
            document.getElementById('budgetRemaining').textContent = '€' + todayLeft.toFixed(0);

            // Update status bar
            const leftEl = document.getElementById('ticketTodayLeft');
            leftEl.textContent = '€' + todayLeft.toFixed(2) + ' left';
            leftEl.className = 'ticket-value' + (todayLeft <= 0 ? ' over' : '');

            // Show today's expenses
            const spentEl = document.getElementById('ticketTodaySpent');
            if (todayExpenses.length > 0) {
                spentEl.innerHTML = todayExpenses.map(e =>
                    `<span style="margin-right: 8px;">${e.name}: €${e.amount.toFixed(2)}</span>`
                ).join('');
            } else {
                spentEl.textContent = 'No ticket resto spent today';
            }

            // Show outside purchases
            const outsideSection = document.getElementById('outsidePurchases');
            const outsideList = document.getElementById('outsideList');

            if (data.outsidePurchases && data.outsidePurchases.length > 0) {
                outsideSection.style.display = 'block';
                outsideList.innerHTML = data.outsidePurchases.map(p => `
                    <div class="outside-item">
                        <span class="outside-item-name">${p.name}</span>
                        <span class="outside-item-amount">€${p.amount.toFixed(2)}</span>
                    </div>
                `).join('');
            } else {
                outsideSection.style.display = 'none';
            }
        }

        // Work schedule
        const workSchedule = {
            '2026-05-04': { type: 'closing' }, '2026-05-06': { type: 'closing' },
            '2026-05-07': { type: 'closing' }, '2026-05-08': { type: 'closing' },
            '2026-05-09': { type: 'opening' }, '2026-05-10': { type: 'custom' },
            '2026-05-11': { type: 'opening' }, '2026-05-12': { type: 'opening' },

            '2026-05-18': { type: 'opening' }, '2026-05-19': { type: 'closing' },
            '2026-05-20': { type: 'closing' }, '2026-05-21': { type: 'opening' },
            '2026-05-22': { type: 'opening' }, '2026-05-23': { type: 'opening' },
            '2026-05-24': { type: 'custom' }, '2026-05-25': { type: 'opening' },
            '2026-05-26': { type: 'opening' }, '2026-05-28': { type: 'opening' },
            '2026-05-29': { type: 'closing' }, '2026-05-30': { type: 'closing' },
            '2026-05-31': { type: 'custom' }, '2026-06-01': { type: 'closing' },
            '2026-06-03': { type: 'custom' }, '2026-06-04': { type: 'closing' },
            '2026-06-05': { type: 'opening' }, '2026-06-06': { type: 'closing' },
            '2026-06-08': { type: 'opening' }, '2026-06-09': { type: 'opening' },
            '2026-06-10': { type: 'closing' }, '2026-06-11': { type: 'opening' },
            '2026-06-12': { type: 'opening' }, '2026-06-14': { type: 'closing' },

        // Meals
        const meals = [
            { id: "moroccan_chicken", name: "Moroccan chicken + potatoes", protein: "high", prepTime: 25, batchFriendly: true, portions: 2, ingredients: ["chicken breast", "small potatoes", "zucchini", "cumin", "paprika", "olive oil"] },
            { id: "jambon_pasta", name: "Pasta crème jambon", protein: "medium", prepTime: 20, batchFriendly: false, portions: 1, ingredients: ["integral pasta", "crème fraîche", "jambon sec", "zucchini", "garlic"] },
            { id: "scrambled_eggs_tomato", name: "Eggs + tomatoes + edam", protein: "high", prepTime: 10, batchFriendly: false, portions: 1, ingredients: ["eggs", "tomatoes", "onion", "edam slices", "bread"] },
            { id: "fish_potatoes", name: "Fish + potatoes + spinach", protein: "high", prepTime: 25, batchFriendly: false, portions: 1, ingredients: ["colin de alaska", "small potatoes", "canned tomatoes", "spinach", "garlic"] },

        // Paris 10ème prices (Franprix/Carrefour City level - expensive area)
        const prices = {
            "chicken breast": 5.50,      // ~300g pack

        // Pantry items you likely already have
        const pantryItems = ["olive oil", "cumin", "paprika", "garlic"];

        const proteinIngredients = ["chicken breast", "colin de alaska", "eggs", "jambon sec"];

        const mealIcons = {
            'moroccan_chicken': '🍗', 'jambon_pasta': '🍝', 'scrambled_eggs_tomato': '🍳',
            'fish_potatoes': '🐟', 'chicken_bowl': '🥗', 'eggs_poivron': '🥚', 'lemon_chicken_rice': '🍋'
        };

        // State
        let currentWeekStart = null;
        let weekData = [];
        let selectedDayIndex = null;

        // Utils
        function getDateKey(d) {
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function getWeekStart() {
            const now = new Date();
            const day = now.getDay();
            const diff = day === 0 ? -6 : 1 - day;
            const mon = new Date(now);
            mon.setDate(now.getDate() + diff);
            mon.setHours(0,0,0,0);
            return mon;
        }

        // Init
        function init() {
            currentWeekStart = getWeekStart();
            updateTicketRestoDisplay();
            buildWeek();
        }

        function buildWeek() {
            const events = JSON.parse(localStorage.getItem('calendarEvents') || '{}');
            weekData = [];

            for (let i = 0; i < 7; i++) {
                const date = new Date(currentWeekStart);
                date.setDate(currentWeekStart.getDate() + i);
                const key = getDateKey(date);
                const work = workSchedule[key];
                const gym = events[key]?.gym;

                weekData.push({
                    date, key,
                    dayName: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][date.getDay()],
                    isWorkDay: !!work,
                    isClosing: work?.type === 'closing',
                    isGymDay: !!gym,
                    isRestDay: !work,
                    isShoppingDay: false,
                    dinner: null,
                    isLeftover: false
                });
            }

            // Pick 2 shopping days from rest days
            const restDays = weekData.filter(d => d.isRestDay);
            if (restDays.length >= 2) {
                restDays[0].isShoppingDay = true;
                restDays[restDays.length - 1].isShoppingDay = true;
            } else if (restDays.length === 1) {
                restDays[0].isShoppingDay = true;
            }

            // Save to calendar
            weekData.forEach(d => {
                if (!events[d.key]) events[d.key] = {};
                events[d.key].shopping = d.isShoppingDay;
            });
            localStorage.setItem('calendarEvents', JSON.stringify(events));

            assignMeals();
            render();
        }

        function assignMeals() {
            const recent = [];
            for (let i = 0; i < weekData.length; i++) {
                const day = weekData[i];
                if (day.dinner || day.isLeftover) continue;

                const valid = meals.filter(m => {
                    if (day.isGymDay && m.protein !== 'high') return false;
                    if (day.isClosing && m.prepTime > 15) return false;
                    if (recent.slice(-4).includes(m.id)) return false;
                    return true;
                });

                if (valid.length === 0) continue;

                const pick = day.isRestDay
                    ? (valid.find(m => m.batchFriendly) || valid[0])
                    : valid[Math.floor(Math.random() * valid.length)];

                day.dinner = pick;
                recent.push(pick.id);

                if (pick.batchFriendly && pick.portions > 1 && weekData[i+1]) {
                    weekData[i+1].dinner = pick;
                    weekData[i+1].isLeftover = true;
                }
            }
        }

        function changeWeek(delta) {
            currentWeekStart.setDate(currentWeekStart.getDate() + delta * 7);
            buildWeek();
        }

        function render() {
            // Week label
            const end = new Date(currentWeekStart);
            end.setDate(end.getDate() + 6);
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            document.getElementById('weekLabel').textContent =
                `${months[currentWeekStart.getMonth()]} ${currentWeekStart.getDate()} - ${months[end.getMonth()]} ${end.getDate()}`;

            // Grid
            const grid = document.getElementById('weekGrid');
            grid.innerHTML = weekData.map((day, i) => {
                let tags = '';
                if (day.isGymDay) tags += '<span class="tag tag-gym">GYM</span>';
                if (day.isClosing) tags += '<span class="tag tag-close">CLOSE</span>';
                else if (day.isWorkDay) tags += '<span class="tag tag-work">WORK</span>';
                if (day.isRestDay) tags += '<span class="tag tag-off">OFF</span>';
                if (day.isShoppingDay) tags += '<span class="tag tag-shop">SHOP</span>';

                let mealHtml = '';
                if (day.dinner) {
                    const m = day.dinner;
                    const icon = mealIcons[m.id] || '🍽️';
                    const ings = m.ingredients.map(ing =>
                        `<span class="ing-tag ${proteinIngredients.includes(ing) ? 'protein' : ''}">${ing}</span>`
                    ).join('');

                    mealHtml = `
                        <div class="meal-slot ${day.isLeftover ? 'leftover' : ''}">
                            <div class="meal-name"><span class="icon">${icon}</span>${m.name}${day.isLeftover ? ' <small>(leftover)</small>' : ''}</div>
                            <div class="meal-ingredients">${ings}</div>
                            <div class="meal-meta">${m.prepTime}min · ${m.protein} protein</div>
                        </div>
                    `;
                } else {
                    mealHtml = `<div class="meal-slot empty"><span class="empty-text">+ add meal</span></div>`;
                }

                return `
                    <div class="day-card ${day.isRestDay ? 'rest-day' : ''} ${day.isShoppingDay ? 'shopping-day' : ''}" onclick="openModal(${i})">
                        <div class="day-header">
                            <div class="day-info">
                                <div class="day-name">${day.dayName}</div>
                                <div class="day-date">${day.date.getDate()}</div>
                            </div>
                            <div class="day-tags">${tags}</div>
                        </div>
                        <div class="meal-content">${mealHtml}</div>
                    </div>
                `;
            }).join('');

            // Shopping
            renderShopping();
        }

        function renderShopping() {
            const container = document.getElementById('shoppingTrips');
            const shopDays = weekData.filter(d => d.isShoppingDay);

            if (shopDays.length === 0) {
                container.innerHTML = '<div class="no-shopping">No rest days for shopping this week</div>';
                return;
            }

            // Collect ingredients (skip pantry items you already have)
            const needs = {};
            weekData.forEach((day, i) => {
                if (!day.dinner || day.isLeftover) return;
                day.dinner.ingredients.forEach(ing => {
                    if (pantryItems.includes(ing)) return;
                    if (!needs[ing]) needs[ing] = { name: ing, forDay: i, price: prices[ing] || 2.00 };
                });
            });

            const allIngs = Object.values(needs);
            const perishable = ['chicken breast', 'colin de alaska', 'spinach', 'tomatoes', 'mozzarella', 'crème fraîche', 'thyme'];

            // Initialize trips
            const trips = shopDays.map(shopDay => ({
                day: shopDay,
                dayIdx: weekData.indexOf(shopDay),
                items: [],
                total: 0
            }));

            // Sort: perishables first, then expensive items (for better distribution)
            allIngs.sort((a, b) => {
                const aPerish = perishable.includes(a.name) ? 0 : 1;
                const bPerish = perishable.includes(b.name) ? 0 : 1;
                if (aPerish !== bPerish) return aPerish - bPerish;
                return b.price - a.price;
            });

            // Smart distribution to stay under €25
            allIngs.forEach(ing => {
                let bestTrip = null;
                let bestScore = -Infinity;

                trips.forEach(trip => {
                    const daysUntil = ing.forDay - trip.dayIdx;
                    const wouldBeTotal = trip.total + ing.price;

                    // If over €25, only use if no other option
                    if (wouldBeTotal > 25) {
                        const hasAlternative = trips.some(t => t !== trip && t.total + ing.price <= 25);
                        if (hasAlternative) return;
                    }

                    let score = 0;

                    // Perishables: must buy close to use
                    if (perishable.includes(ing.name)) {
                        if (daysUntil < 0) return; // can't buy after use
                        if (daysUntil > 4) return; // will spoil
                        score += 100 - daysUntil * 10;
                    } else {
                        // Non-perishables: prefer first trip
                        score += 50 - trip.dayIdx;
                    }

                    // Prefer under budget
                    if (wouldBeTotal <= 25) score += 30;
                    // Balance trips
                    score -= trip.total * 0.5;

                    if (score > bestScore) {
                        bestScore = score;
                        bestTrip = trip;
                    }
                });

                if (bestTrip) {
                    const note = perishable.includes(ing.name)
                        ? `for ${weekData[ing.forDay].dayName}`
                        : 'keeps';
                    bestTrip.items.push({ ...ing, note });
                    bestTrip.total += ing.price;
                }
            });

            // Render
            container.innerHTML = trips.filter(t => t.items.length > 0).map(trip => `
                <div class="shop-trip">
                    <div class="shop-trip-header">
                        <span class="shop-trip-date">${trip.day.dayName} ${trip.day.date.getDate()}</span>
                        <span style="background: rgba(255,255,255,0.2); padding: 3px 8px; border-radius: 10px;">
                            ~€${trip.total.toFixed(0)} ✓
                        </span>
                    </div>
                    <div class="shop-trip-items">
                        ${trip.items.map(item => `
                            <div class="shop-item" onclick="this.classList.toggle('checked')">
                                <div class="shop-item-check"></div>
                                <span class="shop-item-name">${item.name}</span>
                                <span class="shop-item-note">${item.note}</span>
                                <span style="font-size: 0.7rem; color: var(--text-light);">€${item.price.toFixed(2)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('') || '<div class="no-shopping">Add meals to see shopping list</div>';
        }

        // Modal
        function openModal(idx) {
            selectedDayIndex = idx;
            const day = weekData[idx];

            document.getElementById('modalTitle').textContent = `${day.dayName} ${day.date.getDate()}`;

            let sub = '';
            if (day.isGymDay) sub += 'GYM day - high protein only. ';
            if (day.isClosing) sub += 'Closing shift - quick meals (≤15min). ';
            document.getElementById('modalSubtitle').textContent = sub || 'Pick any meal';

            const recent = weekData.slice(Math.max(0, idx-4), idx).filter(d => d.dinner).map(d => d.dinner.id);

            document.getElementById('mealOptions').innerHTML = meals.map(m => {
                const icon = mealIcons[m.id] || '🍽️';
                const isRecent = recent.includes(m.id);
                const needsProtein = day.isGymDay && m.protein !== 'high';
                const tooSlow = day.isClosing && m.prepTime > 15;
                const disabled = isRecent || needsProtein || tooSlow;

                let warn = '';
                if (isRecent) warn = 'Eaten recently';
                else if (needsProtein) warn = 'Not enough protein';
                else if (tooSlow) warn = 'Takes too long';

                return `
                    <div class="meal-option ${disabled ? 'disabled' : ''}" onclick="${disabled ? '' : `selectMeal('${m.id}')`}">
                        <div class="meal-option-name">${icon} ${m.name}</div>
                        <div class="meal-option-ing">${m.ingredients.join(', ')}</div>
                        <div class="meal-option-meta">${m.prepTime}min · ${m.protein} protein${m.batchFriendly ? ' · makes 2' : ''}</div>
                        ${warn ? `<div class="meal-option-warning">${warn}</div>` : ''}
                    </div>
                `;
            }).join('');

            document.getElementById('mealModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('mealModal').classList.remove('active');
            selectedDayIndex = null;
        }

        function selectMeal(id) {
            const meal = meals.find(m => m.id === id);
            if (!meal || selectedDayIndex === null) return;

            weekData[selectedDayIndex].dinner = meal;
            weekData[selectedDayIndex].isLeftover = false;

            if (meal.batchFriendly && meal.portions > 1 && weekData[selectedDayIndex + 1]) {
                weekData[selectedDayIndex + 1].dinner = meal;
                weekData[selectedDayIndex + 1].isLeftover = true;
            }

            closeModal();
            render();
        }

        function clearMeal() {
            if (selectedDayIndex === null) return;
            weekData[selectedDayIndex].dinner = null;
            weekData[selectedDayIndex].isLeftover = false;
            closeModal();
            render();
        }

        document.getElementById('mealModal').addEventListener('click', e => {
            if (e.target.id === 'mealModal') closeModal();
        });

        init();
    </script>
</body>
</html>
